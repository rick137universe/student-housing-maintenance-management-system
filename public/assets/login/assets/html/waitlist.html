<!doctype html>
<html lang="zh-CN">
<head>
<link rel="preload" href="/assets/fonts/SourceHanSansSC-UI-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/SourceHanSansSC-UI-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/SourceHanSansSC-UI-Heavy.woff2" as="font" type="font/woff2" crossorigin>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>账号登录 | FLight</title>
  <link rel="stylesheet" href="/assets/fonts/source-han-sans-sc.css">
  <style>
    @font-face { font-family: DIN; src: url(../fonts/DINish[slnt,wdth,wght].woff2) format("woff2"); font-variation-settings: "wdth" 125; font-weight: 100 900; font-stretch: 50% 125%; font-style: oblique 0deg 12deg; font-display: swap; }
    :root { --font-body: "DIN", "SourceHanSansSC-UI", "SourceHanSansSC", Helvetica Neue, Helvetica, Arial, sans-serif; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { padding: 0; background: transparent; color: #cccac8; color-scheme: dark; font-family: Inter, system-ui, Arial, sans-serif; }
    form { width: 100%; padding: 20px; border-radius: 12px; background: #302e2d; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
    input { display: block; width: 100%; height: 46px; padding: 10px 20px; border: 1px solid #4a4745; border-radius: 24px; background: #252423; color: #f6f4f2; font: 500 16px Inter, system-ui, Arial, sans-serif; outline: none; }
    input::placeholder { color: #85827e; }
    input:focus { border-color: #FF4B4B; }
    button { display: block; width: 100%; height: 40px; margin-top: 20px; border: 0; border-radius: 24px; background: #4B2A29; color: #FF4B4B; font: 600 14px var(--font-body); font-variation-settings: "wdth" 125; -webkit-font-smoothing: antialiased; cursor: pointer; }
    .button-label { display: inline-block; transition: color .125s ease, filter .125s ease; }
    button:enabled:is(:hover, :focus-visible) .button-label { mix-blend-mode: plus-lighter; filter: drop-shadow(0 0 3px #5c2d2c); }
    button:disabled { background: #4B2A29; cursor: not-allowed; }
    form[aria-busy="true"] button:disabled { cursor: wait; }
    @media (prefers-reduced-motion: reduce) { .button-label { transition: none; } }
  </style>
</head>
<body data-dorma-login-form>
  <form>
    <label for="username">账号 <span aria-hidden="true">*</span></label>
    <input id="username" name="username" type="text" placeholder="请输入账号" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" required>
    <label for="password" style="margin-top:16px">密码 <span aria-hidden="true">*</span></label>
    <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" maxlength="128" required>
    <p id="login-error" role="alert" hidden style="margin:12px 0 0;font-size:14px;color:#ff7d7d;overflow-wrap:anywhere"></p>
    <button type="submit" disabled><span class="button-label">登录工作台</span></button>
  </form>
  <script src="../js/login-form.js" type="module"></script>
</body>
</html>
