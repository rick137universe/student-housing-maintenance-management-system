<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>账号登录</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; padding: 20px; background: #fafafa; color: #404040; font-family: Inter, system-ui, Arial, sans-serif; }
    form { width: 100%; padding: 20px; border-radius: 12px; background: #f5f5f5; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
    input { display: block; width: 100%; height: 46px; padding: 10px 20px; border: 1px solid #d8d8d8; border-radius: 24px; background: white; color: #404040; font: 500 16px Inter, system-ui, Arial, sans-serif; outline: none; }
    input:focus { border-color: #334ff1; }
    button { display: block; width: 100%; height: 40px; margin-top: 20px; border: 0; border-radius: 24px; background: #334ff1; color: white; font: 400 14px Inter, system-ui, Arial, sans-serif; cursor: pointer; }
    button:disabled { background: #929ff0; cursor: default; }
  </style>
</head>
<body>
  <form>
    <label for="username">账号 <span aria-hidden="true">*</span></label>
    <input id="username" name="username" type="text" placeholder="请输入账号" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" required>
    <label for="password" style="margin-top:16px">密码 <span aria-hidden="true">*</span></label>
    <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" maxlength="128" required>
    <p id="login-error" role="alert" hidden style="margin:12px 0 0;font-size:14px;color:#b42318;overflow-wrap:anywhere"></p>
    <button type="submit" disabled>登录工作台</button>
  </form>
  <script src="../js/login-form.js" type="module"></script>
</body>
</html>
